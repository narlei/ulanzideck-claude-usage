<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,minimal-ui,viewport-fit=cover" />
  <title>5 hours</title>
  <link rel="stylesheet" href="../../libs/css/udpi.css">
</head>
<body>
  <div class="udpi-wrapper hidden">
    <form id="property-inspector">
      <div class="udpi-item">
        <div class="udpi-item-label" data-localize>Style</div>
        <div class="udpi-item-value" style="display:flex;flex-direction:column;gap:6px;">
          <div class="udpi-item-child" style="display:flex;align-items:center;">
            <input id="style_default" name="style" type="radio" value="default" checked>
            <label for="style_default" class="sdpi-item-label" style="display:flex;align-items:center;"><span></span><text data-localize>Default</text></label>
          </div>
          <div class="udpi-item-child" style="display:flex;align-items:center;">
            <input id="style_pixel" name="style" type="radio" value="pixel">
            <label for="style_pixel" class="sdpi-item-label" style="display:flex;align-items:center;"><span></span><text data-localize>Pixel art</text></label>
          </div>
        </div>
      </div>
    </form>
  </div>

  <script>window.ACTION_UUID = 'com.claude.usage.plugin.fivehour';</script>
  <script src="../../libs/js/constants.js"></script>
  <script src="../../libs/js/eventEmitter.js"></script>
  <script src="../../libs/js/timers.js"></script>
  <script src="../../libs/js/utils.js"></script>
  <script src="../../libs/js/ulanzideckApi.js"></script>
  <script src="../inspector.js"></script>
</body>
</html>
